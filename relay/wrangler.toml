# Ghost Chat WebSocket relay (Cloudflare Workers free plan).
#   npx wrangler deploy   (from this folder)
name = "ghostchat-relay"
main = "ws-relay.js"
compatibility_date = "2025-06-01"

[vars]
ALLOWED_ORIGINS = "https://w3bcooki3.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# The relay keeps no logs: its code logs nothing, and Workers Logs stay off.
[observability]
enabled = false
